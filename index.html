  <body>
    <noscript>
      <p>🚨 Ce site interactif nécessite Javascript 🚨</p>
      <p>Merci de l'activer pour profiter de l'expérience ✨</p>
    </noscript>

    <div class="top-left-content">
      <h1>Développeur Mobile React Native</h1>
      <h2>Guillaume DUVAL</h2>
    </div>

    <div id="linkedin-button">
      <a
        href="https://www.linkedin.com/in/guval/"
        target="_blank"
        rel="noopener noreferrer"
        title="Lien linkedin.com/in/guval"
      >
        <img
          src="/assets/icons/linkedin.svg"
          width="30"
          height="30"
          alt="Linkedin"
        />
        <p>linkedin.com/in/guval</p></a
      >
    </div>

    <div id="github-button">
      <a
        href="https://github.com/guval-gh?tab=overview&from=2025-01-01&to=2025-01-17"
        target="_blank"
        rel="noopener noreferrer"
        title="Lien github.com/guval-gh"
        ><img
          src="/assets/icons/github.svg"
          width="30"
          height="30"
          alt="Github"
        />
        <p>github.com/guval-gh</p></a
      >
    </div>

    <canvas id="canvas"></canvas>
    <canvas id="canvas-mobile"></canvas>

    <script src="https://unpkg.com/@rive-app/canvas@2.20.0"></script>
    <script>
      const layout = new rive.Layout({
        fit: rive.Fit.Contain,
        alignment: rive.Alignment.Center,
      });

      const r = new rive.Rive({
        src: "./assets/animations/guval_cv_v6.riv",
        canvas: document.getElementById("canvas"),
        autoplay: true,
        stateMachines: "State Machine",
        layout: layout,
        onLoad: () => {
          r.resizeDrawingSurfaceToCanvas();
        },
      });

      const r_mobile = new rive.Rive({
        src: "./assets/animations/guval_cv_v6_mobile.riv",
        canvas: document.getElementById("canvas-mobile"),
        autoplay: true,
        stateMachines: "State Machine",
        layout: layout,
        onLoad: () => {
          r_mobile.resizeDrawingSurfaceToCanvas();
        },
      });

      window.addEventListener(
        "resize",
        () => {
          r.resizeDrawingSurfaceToCanvas();
          r_mobile.resizeDrawingSurfaceToCanvas();
        },
        false
      );
    </script>
  </body>
